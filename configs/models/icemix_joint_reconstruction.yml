arguments:
  backbone:
    ModelConfig:
      arguments:
        attn_drop: 0.05
        charge_multiplier: 1024.0
        depth: 12
        depth_rel: 4
        distance_clip_max: 4.0
        distance_clip_min: -4.0
        distance_multiplier: 1024.0
        distance_scale: 18.0
        drop_chance: 1.0
        drop_path_rate: 0.2
        dropout: 0.1
        dynedge_args: null
        eval_token_drop: false
        head_size: 32
        hidden_dim: 384
        include_dynedge: false
        init_values: 1.0
        init_values_rel: 1.0
        mlp_ratio: 4
        n_features: 6
        n_freq: 10000.0
        n_rel: 4
        norm_cls: true
        pos_time_multiplier: 4096.0
        proj_drop: 0.1
        relative_encoder: spacetime
        scaled_emb: true
        seq_length: 128
        token_drop: 0.0
      class_name: DeepIce
  data_representation:
    ModelConfig:
      arguments:
        add_inactive_sensors: false
        add_static_features: false
        detector:
          ModelConfig:
            arguments:
              replace_with_identity: null
            class_name: IceCube86
        dtype: torch.float32
        edge_definition: null
        input_feature_names:
        - dom_x
        - dom_y
        - dom_z
        - dom_time
        - charge
        - hlc
        node_definition:
          ModelConfig:
            arguments:
              add_ice_properties: false
              hlc_name: hlc
              ice_args:
                z_offset: null
                z_scaling: null
              input_feature_names:
              - dom_x
              - dom_y
              - dom_z
              - dom_time
              - charge
              - hlc
              max_pulses: 256
              sample_pulses: true
              z_name: dom_z
            class_name: IceMixNodes
        perturbation_dict: null
        repeat_labels: false
        seed: null
        sensor_mask: null
        sort_by: null
        string_mask: null
      class_name: GraphDefinition
  gnn: null
  graph_definition: null
  optimizer_class: '!class torch.optim.adamw AdamW'
  optimizer_kwargs:
    eps: 1e-05
    lr: 6.25e-05
  scheduler_class: '!class torch.optim.lr_scheduler ReduceLROnPlateau'
  scheduler_config:
    frequency: 1
    monitor: val_loss
  scheduler_kwargs:
    factor: 0.5
    mode: min
    patience: 3
  tasks:
  - ModelConfig:
      arguments:
        hidden_size: 384
        loss_function:
          ModelConfig:
            arguments:
              loss_function:
                ModelConfig:
                  arguments:
                    loss_factors:
                    - 2.6
                    loss_functions:
                    - ModelConfig:
                        arguments: {}
                        class_name: EuclideanDistanceLoss
                    prediction_keys: null
                  class_name: EnsembleLoss
              metric_name: position
            class_name: PerEventRecordingLoss
        nb_outputs: 3
        prediction_labels:
        - position_x_pred
        - position_y_pred
        - position_z_pred
        target_labels:
        - position_x
        - position_y
        - position_z
        transform_inference: "!function def unscale_position(x):  # type: ignore[no-untyped-def]\n    \"\"\"Invert `scale_position`,
          recovering metres at inference time.\"\"\"\n    x[:, 0] = x[:, 0] * 100.0 + 46.3\n    x[:, 1] = x[:, 1] * 100.0
          - 34.9\n    x[:, 2] = x[:, 2] * 100.0 - 350.0\n    return x\n"
        transform_target: "!function def scale_position(x):  # type: ignore[no-untyped-def]\n    \"\"\"Map vertex targets
          from metres to detector-centred O(1) units.\n\n    Inlined constants and the unannotated signature keep the function\n\
          \    serialisable (`ModelConfig.FUNCTION_DEFINITION_PATTERN` rejects\n    annotated defs).\n    \"\"\"\n    x[:,
          0] = (x[:, 0] - 46.3) / 100.0\n    x[:, 1] = (x[:, 1] + 34.9) / 100.0\n    x[:, 2] = (x[:, 2] + 350.0) / 100.0\n\
          \    return x\n"
      class_name: IdentityTask
  - ModelConfig:
      arguments:
        hidden_size: 384
        loss_function:
          ModelConfig:
            arguments:
              loss_function:
                ModelConfig:
                  arguments:
                    approximation: tight
                    kappa_switch: 700.0
                  class_name: VonMisesFisher3DLoss
              metric_name: direction
            class_name: PerEventRecordingLoss
        target_labels:
        - direction
      class_name: DirectionReconstructionWithKappaDecoupled
class_name: StandardModel
